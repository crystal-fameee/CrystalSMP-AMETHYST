name: Build Crystal-Amethyst

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Check JAR
        run: |
          echo "Contents of target:"
          ls -lah target/
          test -f target/Crystal-Amethyst-1.2.2.jar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Amethyst-1.2.2
          path: target/Crystal-Amethyst-1.2.2.jar
          if-no-files-found: error

